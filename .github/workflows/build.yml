          cat > $D/Grid.kt <<'EOF'
          package live.savvy3

          import android.graphics.Rect

          object Grid {
              data class Cell(val ch: Char, val box: Rect)

              fun best(cells: List<Cell>): Pair<Int, List<List<Cell>>>? {
                  val bands = cells.groupBy { it.box.centerY() / 45 }
                  val rows = ArrayList<List<Cell>>()
                  for (b in bands.values) {
                      val r = b.sortedBy { it.box.centerX() }
                      if (r.size in 4..7) rows.add(r)
                  }
                  if (rows.isEmpty()) return null
                  var n = 0
                  var most = 0
                  for (r in rows) {
                      val c = rows.count { it.size == r.size }
                      if (c > most) { most = c; n = r.size }
                  }
                  val keep = rows.filter { it.size == n }
                  if (keep.isEmpty()) return null
                  val widths = ArrayList<Int>()
                  for (r in keep) for (c in r) widths.add(c.box.width())
                  widths.sort()
                  val med = widths[widths.size / 2]
                  val ok = ArrayList<List<Cell>>()
                  for (r in keep) {
                      var good = true
                      for (c in r) if (c.box.width() < (med * 0.5f).toInt() || c.box.width() > (med * 1.8f).toInt()) good = false
                      if (good) ok.add(r)
                  }
                  if (ok.isEmpty()) return null
                  return Pair(n, ok)
              }
          }
          EOF

          cat > $D/Tiles.kt <<'EOF'
          package live.savvy3

          import android.graphics.Bitmap
          import android.graphics.Color

          object Tiles {
              private fun hsv(b: Bitmap, x0: Int, y0: Int): FloatArray {
                  var r = 0L
                  var g = 0L
                  var bl = 0L
                  var n = 0
                  for (dx in -9..9) for (dy in -9..9) {
                      val x = (x0 + dx).coerceIn(0, b.width - 1)
                      val y = (y0 + dy).coerceIn(0, b.height - 1)
                      val p = b.getPixel(x, y)
                      r += Color.red(p)
                      g += Color.green(p)
                      bl += Color.blue(p)
                      n++
                  }
                  val out = FloatArray(3)
                  if (n == 0) return out
                  Color.RGBToHSV((r / n).toInt(), (g / n).toInt(), (bl / n).toInt(), out)
                  return out
              }

              fun marks(b: Bitmap, row: List<Grid.Cell>, mult: Float): String {
                  val s = ArrayList<FloatArray>()
                  for (c in row) s.add(hsv(b, c.box.centerX(), c.box.centerY()))
                  val sats = ArrayList<Float>()
                  for (v in s) if (v[2] > 0.09f / mult) sats.add(v[1])
                  if (sats.isEmpty()) return "?".repeat(row.size)
                  sats.sort()
                  val med = sats[sats.size / 2]
                  val sb = StringBuilder()
                  for (v in s) {
                      if (v[2] <= 0.09f / mult) sb.append('?')
                      else if (v[1] < 0.18f * mult || v[1] < med * 0.6f) sb.append('x')
                      else if (v[0] < 78f) sb.append('y')
                      else sb.append('g')
                  }
                  return sb.toString()
              }
          }
          EOF

          cat > $D/Ocr.kt <<'EOF'
          package live.savvy3

          import android.graphics.Bitmap
          import android.graphics.Rect
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions

          object Ocr {
              private var rec: com.google.mlkit.vision.text.TextRecognizer? = null

              private fun get(): com.google.mlkit.vision.text.TextRecognizer {
                  var r = rec
                  if (r == null) {
                      r = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                      rec = r
                  }
                  return r
              }

              fun scan(b: Bitmap, done: (List<Grid.Cell>) -> Unit) {
                  val top = (b.height * 0.18f).toInt()
                  val bot = (b.height * 0.82f).toInt()
                  val crop = Bitmap.createBitmap(b, 0, top, b.width, bot - top)

                  get().process(InputImage.fromBitmap(crop, 0))
                      .addOnSuccessListener { t ->
                          val out = ArrayList<Grid.Cell>()
                          for (bl in t.textBlocks) for (ln in bl.lines) for (e in ln.elements) {
                              val s = e.text.trim()
                              if (s.isEmpty() || !s.all { it.isLetter() }) continue
                              val bb = e.boundingBox ?: continue
                              if (bb.height() < 14 || bb.height() > 140) continue
                              if (s.length == 1) {
                                  if (bb.width() >= 8 && bb.width() <= 140)
                                      out.add(Grid.Cell(s[0].lowercaseChar(),
                                          Rect(bb.left, bb.top + top, bb.right, bb.bottom + top)))
                              } else {
                                  val w = bb.width() / s.length
                                  if (w >= 8 && w <= 140) for (i in s.indices)
                                      out.add(Grid.Cell(s[i].lowercaseChar(), Rect(
                                          bb.left + i * w, bb.top + top,
                                          bb.left + (i + 1) * w, bb.bottom + top)))
                              }
                          }
                          done(out)
                      }
                      .addOnFailureListener { done(emptyList()) }
              }
          }
