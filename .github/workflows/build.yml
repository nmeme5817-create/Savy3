          cat > $D/CaptureService.kt <<'EOF'
          package live.savvy3

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.core.app.NotificationCompat

          class CaptureService : Service() {

              private lateinit var wm: WindowManager
              private var proj: MediaProjection? = null
              private var vd: VirtualDisplay? = null
              private var ir: ImageReader? = null
              private var box: LinearLayout? = null
              private var strip: LinearLayout? = null
              private var line: TextView? = null
              private var solver: Solver? = null

              private val h = Handler(Looper.getMainLooper())
              private var lastHash = 0
              private var busy = false
              private var scanning = false
              private var running = false
              private var collapsed = false

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  solver = Solver(Words.load(this))
              }

              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  val action = i?.action
                  if (action == OFF) { stopSelf(); return START_NOT_STICKY }
                  if (action != ON) return START_STICKY

                  note()
                  val code = i.getIntExtra("code", 0)
                  val data: Intent? = i.getParcelableExtra("data")
                  if (data == null) return START_NOT_STICKY

                  val m = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  proj = m.getMediaProjection(code, data)
                  proj?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { stopSelf() }
                  }, h)

                  val d = resources.displayMetrics
                  ir = ImageReader.newInstance(d.widthPixels, d.heightPixels, PixelFormat.RGBA_8888, 2)
                  vd = proj?.createVirtualDisplay("sp", d.widthPixels, d.heightPixels, d.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, ir!!.surface, null, h)

                  overlay()
                  running = true
                  h.post(loop)
                  return START_STICKY
              }

              private fun note() {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel(CH, "Savvy 3", NotificationManager.IMPORTANCE_LOW))
                  startForeground(1, NotificationCompat.Builder(this, CH)
                      .setContentTitle("Savvy 3 running")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setOngoing(true)
                      .build())
              }

              private val loop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      try { step() } catch (t: Throwable) { say("error " + t.message) }
                      h.postDelayed(this, 300)
                  }
              }

              private fun grab(): Bitmap? {
                  val img = ir?.acquireLatestImage() ?: return null
                  return try {
                      val p = img.planes[0]
                      val b = Bitmap.createBitmap(
                          p.rowStride / p.pixelStride, img.height, Bitmap.Config.ARGB_8888)
                      b.copyPixelsFromBuffer(p.buffer)
                      b
                  } finally {
                      img.close()
                  }
              }

              private fun step() {
                  if (busy || scanning) return
                  val bmp = grab() ?: return say("no frames")

                  val tree = A11y.me?.letters() ?: emptyList()
                  if (tree.size >= 4 && Grid.best(tree) != null) { onCells(tree, bmp); return }

                  scanning = true
                  Ocr.scan(bmp) { cells ->
                      scanning = false
                      onCells(cells, bmp)
                  }
              }

              private fun onCells(cells: List<Grid.Cell>, bmp: Bitmap) {
                  val s = solver ?: return
                  if (cells.isEmpty()) return say("no letters found")
                  val g = Grid.best(cells) ?: return say(cells.size.toString() + " letters, no grid")
                  val n = g.first
                  val grid = g.second
                  val mult = prefs().getFloat("tol", 1f)

                  val rows = ArrayList<Solver.Row>()
                  for (r in grid) {
                      if (rows.size >= 6) break
                      var letters = ""
                      for (c in r) letters += c.ch.toString()
                      val marks = Tiles.marks(bmp, r, mult)
                      var known = 0
                      for (ch in marks) if (ch == 'g' || ch == 'y' || ch == 'x') known++
                      if (known >= n - 1) rows.add(Solver.Row(letters, marks))
                  }
                  if (rows.isEmpty()) return say("waiting for marks")

                  val done = ArrayList<Solver.Row>()
                  for (r in rows) for (ch in r.marks) if (ch != '?') { done.add(r); break }

                  var hash = 7
                  for (r in done) hash = hash * 31 + (r.letters + r.marks).hashCode()
                  val out = s.solve(done, n, prefs().getInt("mode", 0))
                  if (out.pool == 0) return say("no fit - check board")

                  say(out.pool.toString() + " left")
                  show(out.ranked.take(5))

                  if (prefs().getBoolean("auto", false) && out.ranked.isNotEmpty()
                      && hash != lastHash && done.size < 6) {
                      lastHash = hash
                      busy = true
                      Typer.type(out.ranked[0], prefs().getLong("delay", 85L)) { busy = false }
                  }
              }

              private fun overlay() {
                  val b = LinearLayout(this)
                  b.orientation = LinearLayout.VERTICAL
                  b.setPadding(16, 10, 16, 12)
                  b.setBackgroundColor(0xEE0D1117.toInt())

                  val head = LinearLayout(this)
                  head.orientation = LinearLayout.HORIZONTAL

                  val toggle = TextView(this)
                  toggle.text = "—"
                  toggle.textSize = 15f
                  toggle.setTextColor(0xFF8FA6BD.toInt())
                  toggle.setPadding(0, 0, 16, 0)
                  toggle.setOnClickListener {
                      collapsed = !collapsed
                      val st = strip
                      if (st != null) st.visibility =
                          if (collapsed) LinearLayout.GONE else LinearLayout.VISIBLE
                  }
                  head.addView(toggle)

                  val t = TextView(this)
                  t.textSize = 11f
                  t.setTextColor(0xFF8FA6BD.toInt())
                  line = t
                  head.addView(t)

                  val st = LinearLayout(this)
                  st.orientation = LinearLayout.HORIZONTAL
                  strip = st

                  b.addView(head)
                  b.addView(st)

                  val p = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT)
                  p.gravity = Gravity.BOTTOM

                  runCatching { wm.addView(b, p) }
                  box = b
              }

              private fun show(ws: List<String>) {
                  val s = strip ?: return
                  s.removeAllViews()
                  for (i in ws.indices) {
                      val tv = TextView(this)
                      tv.text = ws[i].uppercase()
                      tv.textSize = if (i == 0) 21f else 15f
                      tv.setTextColor(if (i == 0) 0xFFFFFFFF.toInt() else 0xFFCFE3FF.toInt())
                      tv.setPadding(14, 7, 14, 7)
                      val w = ws[i]
                      tv.setOnClickListener {
                          lastHash = 0
                          busy = true
                          Typer.type(w, prefs().getLong("delay", 85L)) { busy = false }
                      }
                      s.addView(tv)
                  }
              }

              private fun say(t: String) {
                  val l = line
                  if (l != null) l.text = t
              }

              private fun prefs() = getSharedPreferences("bot", MODE_PRIVATE)

              override fun onDestroy() {
                  running = false
                  h.removeCallbacksAndMessages(null)
                  val b = box
                  if (b != null) runCatching { wm.removeView(b) }
                  vd?.release()
                  ir?.close()
                  proj?.stop()
                  super.onDestroy()
              }

              override fun onBind(i: Intent?): IBinder? = null

              companion object {
                  const val CH = "sp"
                  const val ON = "on"
                  const val OFF = "off"
              }
          }
          EOF

