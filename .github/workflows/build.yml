          package live.savvy3

          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.Switch
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var status: TextView
              private lateinit var out: TextView

              private val launch =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                      if (r.resultCode == RESULT_OK && r.data != null) {
                          val i = Intent(this, CaptureService::class.java)
                          i.action = CaptureService.ON
                          i.putExtra("code", r.resultCode)
                          i.putExtra("data", r.data)
                          startForegroundService(i)
                          status.text = "running - switch to Savvy"
                      }
                  }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  val p = getSharedPreferences("bot", MODE_PRIVATE)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(44, 56, 44, 44)

                  val title = TextView(this)
                  title.text = "Savvy 3"
                  title.textSize = 26f
                  root.addView(title)

                  val sub = TextView(this)
                  sub.text = "Grant both, then start. Strip appears over the game."
                  sub.textSize = 13f
                  sub.setPadding(0, 12, 0, 26)
                  root.addView(sub)

                  val a11y = Button(this)
                  a11y.text = "1. Accessibility"
                  a11y.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  root.addView(a11y)

                  val ov = Button(this)
                  ov.text = "2. Draw over apps"
                  ov.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:" + packageName)))
                  }
                  root.addView(ov)

                  val auto = Switch(this)
                  auto.text = "Auto-send"
                  auto.isChecked = p.getBoolean("auto", false)
                  auto.setPadding(0, 24, 0, 6)
                  auto.setOnCheckedChangeListener { _, v -> p.edit().putBoolean("auto", v).apply() }
                  root.addView(auto)

                  val mode = CheckBox(this)
                  mode.text = "Solve mode (finds word, fewer placements)"
                  mode.isChecked = p.getInt("mode", 0) == 1
                  mode.setOnCheckedChangeListener { _, v -> p.edit().putInt("mode", if (v) 1 else 0).apply() }
                  root.addView(mode)

                  val dl = TextView(this)
                  dl.text = "Tap delay (ms)"
                  dl.textSize = 12f
                  dl.setPadding(0, 14, 0, 0)
                  root.addView(dl)

                  val delay = EditText(this)
                  delay.inputType = InputType.TYPE_CLASS_NUMBER
                  delay.setText(p.getLong("delay", 85L).toString())
                  delay.addTextChangedListener(object : android.text.TextWatcher {
                      override fun afterTextChanged(e: android.text.Editable?) {
                          val v = e?.toString()?.toLongOrNull()
                          if (v != null) p.edit().putLong("delay", v).apply()
                      }
                      override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                  })
                  root.addView(delay)

                  val start = Button(this)
                  start.text = "Start"
                  start.setPadding(0, 26, 0, 0)
                  start.setOnClickListener {
                      if (A11y.me == null) { status.text = "enable accessibility first"; return@setOnClickListener }
                      if (!Settings.canDrawOverlays(this@MainActivity)) {
                          status.text = "allow overlay first"
                          return@setOnClickListener
                      }
                      val m = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      launch.launch(m.createScreenCaptureIntent())
                  }
                  root.addView(start)

                  val stop = Button(this)
                  stop.text = "Stop"
                  stop.setOnClickListener {
                      val i = Intent(this, CaptureService::class.java)
                      i.action = CaptureService.OFF
                      startService(i)
                      status.text = "stopped"
                  }
                  root.addView(stop)

                  val mh = TextView(this)
                  mh.text = "Manual board (e.g. crane gxyxx)"
                  mh.textSize = 12f
                  mh.setPadding(0, 30, 0, 4)
                  root.addView(mh)

                  val manual = EditText(this)
                  manual.hint = "crane gxyxx"
                  root.addView(manual)

                  val go = Button(this)
                  go.text = "Solve manually"
                  go.setOnClickListener {
                      val rows = ArrayList<Solver.Row>()
                      for (t in manual.text.toString().trim().lowercase().split(" ")) {
                          if (t.length < 4) continue
                          val n = t.length / 2
                          rows.add(Solver.Row(t.substring(0, n), t.substring(n)))
                      }
                      if (rows.isEmpty()) { out.text = "nothing to solve"; return@setOnClickListener }
                      val n = rows[0].letters.length
                      val r = Solver(Words.load(this@MainActivity)).solve(rows, n, p.getInt("mode", 0))
                      out.text = if (r.pool == 0) "no fit" else r.ranked.take(8).joinToString("  ")
                  }
                  root.addView(go)

                  out = TextView(this)
                  out.textSize = 18f
                  out.setPadding(0, 12, 0, 0)
                  root.addView(out)

                  val st = TextView(this)
                  st.text = Stats.text(this)
                  st.textSize = 12f
                  st.setPadding(0, 26, 0, 0)
                  root.addView(st)

                  status = TextView(this)
                  status.textSize = 13f
                  status.setPadding(0, 14, 0, 0)
                  root.addView(status)

                  setContentView(root)
              }
          }
