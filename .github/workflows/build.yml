          cat > $D/A11y.kt <<'EOF'
          package live.savvy3

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.Rect
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class A11y : AccessibilityService() {

              override fun onServiceConnected() { me = this }
              override fun onDestroy() { me = null; super.onDestroy() }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              private fun top(): AccessibilityNodeInfo? {
                  val r = rootInActiveWindow ?: return null
                  if (r.packageName == GAME) return r
                  for (w in windows) if (w.root?.packageName == GAME) return w.root
                  return null
              }

              fun letters(): List<Grid.Cell> {
                  val r = top() ?: return emptyList()
                  val o = ArrayList<Grid.Cell>()
                  walk(r, o, 0)
                  return o
              }

              private fun walk(n: AccessibilityNodeInfo?, o: MutableList<Grid.Cell>, d: Int) {
                  if (n == null || d > 40) return
                  val t = (n.text ?: n.contentDescription)?.toString()?.trim()
                  if (t != null && t.length == 1 && t[0].isLetter()) {
                      val b = Rect()
                      n.getBoundsInScreen(b)
                      if (b.width() > 12 && b.height() > 12) o.add(Grid.Cell(t[0].lowercaseChar(), b))
                  }
                  for (i in 0 until n.childCount) walk(n.getChild(i), o, d + 1)
              }

              fun tap(label: String): Boolean {
                  val r = top() ?: return false
                  val hit = find(r, label, 0) ?: return false
                  var n: AccessibilityNodeInfo? = hit
                  while (n != null) {
                      if (n.isClickable) return n.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      n = n.parent
                  }
                  val b = Rect()
                  hit.getBoundsInScreen(b)
                  return tapAt(b.centerX().toFloat(), b.centerY().toFloat())
              }

              private fun find(n: AccessibilityNodeInfo?, l: String, d: Int): AccessibilityNodeInfo? {
                  if (n == null || d > 40) return null
                  val t = (n.text ?: n.contentDescription)?.toString()?.trim()
                  if (t != null && t.equals(l, true)) return n
                  for (i in 0 until n.childCount) {
                      val f = find(n.getChild(i), l, d + 1)
                      if (f != null) return f
                  }
                  return null
              }

              fun tapAt(x: Float, y: Float): Boolean {
                  val p = Path()
                  p.moveTo(x, y)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p, 0, 40))
                      .build()
                  return dispatchGesture(g, null, null)
              }

              companion object {
                  const val GAME = "live.playsavvy.savvy"
                  var me: A11y? = null
              }
          }
          EOF

          cat > $D/Typer.kt <<'EOF'
          package live.savvy3

          import android.os.Handler
          import android.os.Looper

          object Typer {
              private val h = Handler(Looper.getMainLooper())
              private val GO = listOf("enter", "submit", "guess", "send", "done")

              fun type(w: String, delay: Long, done: () -> Unit) {
                  val s = A11y.me
                  if (s == null) { done(); return }
                  var i = 0
                  val step = object : Runnable {
                      override fun run() {
                          if (i < w.length) {
                              s.tap(w[i].toString())
                              i++
                              h.postDelayed(this, delay)
                          } else {
                              h.postDelayed({
                                  for (g in GO) if (s.tap(g)) break
                                  done()
                              }, 120)
                          }
                      }
                  }
                  h.post(step)
              }
          }
          EOF

